<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e60012">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Phantom Habits</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1><span>TAKE YOUR</span> HABITS</h1><p id="fecha"></p></header>
<main>
  <section id="stats" class="stats"></section>
  <section>
    <h2 class="tag">Hoy</h2>
    <ul id="lista" class="lista"></ul>
    <p id="vacio" class="vacio" hidden>Sin hábitos todavía. Agrega uno pequeño abajo.</p>
  </section>
  <section class="nuevo">
    <h2 class="tag">Nuevo hábito</h2>
    <input id="nombre" maxlength="40" placeholder="Ej: Leer 5 minutos">
    <select id="stat"></select>
    <button id="agregar" class="btn">Agregar</button>
  </section>
</main>
<div id="banner" class="banner" hidden></div>
<script src="app.js"></script>
</body>
</html>
